<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16324F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>নোট প্যাড</title>
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --ink: #182430;
    --muted: #667280;
    --border: #e3e7eb;
    --primary: #17344f;
    --primary-hover: #0f2437;
    --accent: #2f8f89;
    --accent-hover: #257873;
    --warn: #b8873b;
    --warn-soft: #fbf3e6;
    --danger: #b3433b;
    --danger-hover: #96362f;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(20,30,40,0.04), 0 6px 20px rgba(20,30,40,0.06);
    --shadow-hover: 0 2px 4px rgba(20,30,40,0.06), 0 10px 28px rgba(20,30,40,0.10);
  }

  * { box-sizing: border-box; }
  svg { stroke: currentColor; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Hind Siliguri', 'Inter', 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 0%, rgba(47,143,137,0.07), transparent 45%),
                       radial-gradient(circle at 100% 10%, rgba(23,52,79,0.05), transparent 40%);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 clamp(18px, 5.5vw, 34px) 48px;
  }

  /* ---------- header ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(238, 241, 244, 0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: max(20px, env(safe-area-inset-top)) clamp(18px, 5.5vw, 34px) 16px;
    margin: 0 calc(-1 * clamp(18px, 5.5vw, 34px));
  }
  .header-row {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 13px;
  }
  .brand-mark {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(145deg, var(--primary), #1f4d73);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(23,52,79,0.25);
  }
  .brand-mark svg { width: 27px; height: 27px; stroke: #fff; }
  h1 {
    font-size: clamp(29.6px, 6vw, 37.3px);
    font-weight: 700;
    color: var(--primary);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--primary);
    width: 54px;
    height: 54px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .icon-btn svg { width: 24px; height: 24px; }
  .icon-btn:hover { background: #f6f8f9; border-color: #d3d9de; }
  .icon-btn:active { transform: scale(0.94); }

  /* ---------- card / form ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: clamp(22px, 5.5vw, 32px);
    box-shadow: var(--shadow);
    margin: 22px 0 26px;
  }
  .field-label {
    font-size: 18.7px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
    display: block;
  }
  input[type="text"], input[type="password"], textarea {
    width: 100%;
    padding: 15px 17px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 22.5px;
    margin-bottom: 17px;
    font-family: inherit;
    color: var(--ink);
    background: #fbfcfd;
    transition: border-color 0.15s, background 0.15s;
  }
  input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }
  textarea {
    min-height: 175px;
    resize: vertical;
    line-height: 1.6;
  }

  /* ---------- password field with eye toggle ---------- */
  .pw-field { position: relative; }
  .pw-field input { padding-right: 52px; }
  .pw-toggle {
    position: absolute;
    right: 6px;
    top: 0;
    height: 100%;
    background: none;
    border: none;
    color: var(--muted);
    padding: 0 12px;
    min-height: auto;
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .pw-toggle svg { width: 22px; height: 22px; stroke: var(--muted); }
  .pw-toggle:hover { color: var(--ink); background: none; }
  .pw-toggle:hover svg { stroke: var(--ink); }

  button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 17px 24px;
    border-radius: var(--radius-sm);
    font-size: 21.8px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 62px;
  }
  button svg { width: 22px; height: 22px; flex-shrink: 0; stroke: currentColor; }
  button:hover { background: var(--primary-hover); }
  button:active { transform: scale(0.98); }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-row > button { flex: 1; min-width: 150px; }
  .btn-danger { background: var(--danger); }
  .btn-danger:hover { background: var(--danger-hover); }
  .btn-secondary { background: transparent; color: var(--primary); border: 1.5px solid var(--border); }
  .btn-secondary:hover { background: #f6f8f9; border-color: #d3d9de; }
  .btn-accent { background: var(--accent); }
  .btn-accent:hover { background: var(--accent-hover); }
  .btn-sm { min-height: 50px; padding: 9px 17px; font-size: 19.3px; }
  .btn-full { width: 100%; }

  .lock-toggle-row {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 8px;
    font-size: 20.6px;
    color: var(--ink);
    padding: 4px 2px;
  }
  .lock-toggle-row input[type="checkbox"] {
    width: 23px;
    height: 23px;
    margin: 0;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  #notePwWrap { display: none; margin-top: 6px; }

  /* ---------- search ---------- */
  .search-box {
    position: relative;
    margin-bottom: 22px;
  }
  .search-box svg {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    width: 21px;
    height: 21px;
    stroke: var(--muted);
    pointer-events: none;
  }
  .search-box input {
    margin-bottom: 0;
    padding-left: 52px;
  }

  /* ---------- notes list ---------- */
  .section-label {
    font-size: 16.1px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 4px 2px 10px;
  }
  .note-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 19px 21px;
    margin-bottom: 13px;
    border-left: 4px solid var(--accent);
    box-shadow: var(--shadow);
    transition: box-shadow 0.15s, transform 0.12s, border-color 0.15s;
  }
  .note-item.locked { border-left-color: var(--warn); }
  .note-item:hover { box-shadow: var(--shadow-hover); }

  .note-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .note-title-row svg.lock-icon { width: 18px; height: 18px; stroke: var(--warn); flex-shrink: 0; }
  .note-title {
    font-weight: 600;
    color: var(--ink);
    font-size: 23.9px;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .note-item.expanded .note-title {
    white-space: normal;
    word-break: break-word;
  }
  .chevron {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--muted);
    transition: transform 0.2s;
  }
  .chevron svg { width: 19px; height: 19px; stroke: var(--muted); }
  .note-item.expanded .chevron { transform: rotate(180deg); }

  .note-body {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .note-preview-full {
    color: var(--ink);
    font-size: 19.9px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .note-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .note-actions { display: flex; gap: 8px; }
  .note-date {
    color: #9aa4ad;
    font-size: 16.7px;
  }
  .empty-msg {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 21.8px;
  }
  .empty-msg svg { width: 48px; height: 48px; stroke: #c3cbd1; margin-bottom: 16px; }
  .status-msg {
    text-align: center;
    color: var(--accent);
    font-weight: 600;
    font-size: 19.9px;
    margin-bottom: 10px;
    min-height: 20px;
  }

  /* ---------- overlay (app lock + note password prompts) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #17344f, #0e2032);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  .overlay-card {
    background: var(--surface);
    border-radius: 22px;
    padding: clamp(34px, 8vw, 46px) clamp(28px, 7vw, 38px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    max-width: 460px;
    width: 100%;
    text-align: center;
  }
  .overlay-icon {
    width: 70px;
    height: 70px;
    border-radius: 18px;
    background: var(--warn-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  .overlay-icon svg { width: 32px; height: 32px; stroke: var(--warn); }
  .overlay-card h2 {
    color: var(--primary);
    font-size: 32.1px;
    margin: 0 0 9px;
  }
  .overlay-card p {
    color: var(--muted);
    font-size: 20.6px;
    margin: 0 0 22px;
    line-height: 1.5;
  }
  .overlay-error {
    color: var(--danger);
    font-size: 19.3px;
    font-weight: 600;
    min-height: 22px;
    margin-bottom: 8px;
  }
  .hidden { display: none !important; }

  @media (max-width: 420px) {
    .btn-row { flex-direction: column; }
    .btn-row > button { width: 100%; }
    .note-footer { flex-direction: row; }
  }
</style>
</head>
<body>

<!-- App lock overlay -->
<div class="overlay" id="appLockOverlay">
  <div class="overlay-card">
    <div class="overlay-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/></svg>
    </div>
    <h2 id="appLockTitle">অ্যাপ আনলক করুন</h2>
    <p id="appLockDesc">চালিয়ে যেতে পাসওয়ার্ড দিন</p>
    <div class="pw-field">
      <input type="password" id="appLockInput" placeholder="পাসওয়ার্ড">
      <button type="button" class="pw-toggle" onclick="togglePw('appLockInput', this)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="pw-field hidden" id="appLockConfirmWrap">
      <input type="password" id="appLockConfirmInput" placeholder="পাসওয়ার্ড আবার লিখুন">
      <button type="button" class="pw-toggle" onclick="togglePw('appLockConfirmInput', this)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="overlay-error" id="appLockError"></div>
    <button class="btn-full" onclick="handleAppLockSubmit()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      ঠিক আছে
    </button>
  </div>
</div>

<!-- Note password overlay -->
<div class="overlay hidden" id="notePwOverlay">
  <div class="overlay-card">
    <div class="overlay-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/></svg>
    </div>
    <h2>নোটটি সুরক্ষিত</h2>
    <p>এই নোটটি দেখতে পাসওয়ার্ড দিন</p>
    <div class="pw-field">
      <input type="password" id="notePwPromptInput" placeholder="পাসওয়ার্ড">
      <button type="button" class="pw-toggle" onclick="togglePw('notePwPromptInput', this)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="overlay-error" id="notePwError"></div>
    <div class="btn-row">
      <button class="btn-accent" onclick="submitNotePwPrompt()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        খুলুন
      </button>
      <button class="btn-secondary" onclick="closeNotePwPrompt()">বাতিল</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="topbar">
    <div class="header-row">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/></svg>
        </div>
        <h1>আমার নোট প্যাড</h1>
      </div>
      <button class="icon-btn" title="অ্যাপ লক করুন" onclick="lockApp()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/></svg>
      </button>
    </div>
  </div>

  <div class="card">
    <label class="field-label" for="noteName">নোটের নাম</label>
    <input type="text" id="noteName" placeholder="নোটের নাম লিখুন...">

    <label class="field-label" for="noteContent">বিস্তারিত</label>
    <textarea id="noteContent" placeholder="এখানে লিখুন..."></textarea>

    <div class="lock-toggle-row">
      <input type="checkbox" id="noteLockToggle" onchange="toggleNotePwField()">
      <label for="noteLockToggle">এই নোটটি পাসওয়ার্ড দিয়ে সুরক্ষিত করুন (ঐচ্ছিক)</label>
    </div>
    <div id="notePwWrap">
      <div class="pw-field">
        <input type="password" id="notePwField" placeholder="নোটের পাসওয়ার্ড দিন">
        <button type="button" class="pw-toggle" onclick="togglePw('notePwField', this)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>

    <div class="btn-row" style="margin-top:4px;">
      <button onclick="saveNote()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
        Save করুন
      </button>
      <button class="btn-secondary" onclick="clearForm()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        নতুন নোট
      </button>
    </div>
  </div>

  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="নাম দিয়ে খুঁজুন..." oninput="renderNotes()">
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <div id="notesList"></div>
</div>

<script>
  let allNotes = {}; // key -> {name, content, date, pwHash?}
  let editingKey = null;
  let expandedTitles = new Set();
  let unlockedNotes = new Set(); // notes whose password has been verified this session
  let pendingUnlockKey = null; // note awaiting password before opening
  let pendingUnlockAction = 'expand'; // 'expand' or 'edit'
  const STORAGE_KEY = 'my_notepad_notes';
  const APP_PW_KEY = 'app_password_hash';

  // ---------- helpers ----------
  async function sha256(text) {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  const eyeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeOffIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>';

  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.innerHTML = showing ? eyeIcon : eyeOffIcon;
  }

  function resetPwVisibility(inputId) {
    const input = document.getElementById(inputId);
    if (!input) return;
    input.type = 'password';
    const btn = input.parentElement.querySelector('.pw-toggle');
    if (btn) btn.innerHTML = eyeIcon;
  }

  function showStatus(msg) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    setTimeout(() => { el.textContent = ''; }, 2000);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // ---------- app lock ----------
  function isAppPasswordSet() {
    return !!localStorage.getItem(APP_PW_KEY);
  }

  function initAppLock() {
    const overlay = document.getElementById('appLockOverlay');
    const confirmWrap = document.getElementById('appLockConfirmWrap');
    const confirmInput = document.getElementById('appLockConfirmInput');
    if (isAppPasswordSet()) {
      document.getElementById('appLockTitle').textContent = 'অ্যাপ আনলক করুন';
      document.getElementById('appLockDesc').textContent = 'চালিয়ে যেতে পাসওয়ার্ড দিন';
      confirmWrap.classList.add('hidden');
    } else {
      document.getElementById('appLockTitle').textContent = 'একটি পাসওয়ার্ড সেট করুন';
      document.getElementById('appLockDesc').textContent = 'অ্যাপে প্রবেশের জন্য একটি পাসওয়ার্ড তৈরি করুন';
      confirmWrap.classList.remove('hidden');
    }
    document.getElementById('appLockInput').value = '';
    confirmInput.value = '';
    document.getElementById('appLockError').textContent = '';
    resetPwVisibility('appLockInput');
    resetPwVisibility('appLockConfirmInput');
    overlay.classList.remove('hidden');
    setTimeout(() => document.getElementById('appLockInput').focus(), 100);
  }

  async function handleAppLockSubmit() {
    const pw = document.getElementById('appLockInput').value;
    const errEl = document.getElementById('appLockError');
    if (!pw) { errEl.textContent = 'পাসওয়ার্ড দিন'; return; }

    if (isAppPasswordSet()) {
      const hash = await sha256(pw);
      if (hash === localStorage.getItem(APP_PW_KEY)) {
        document.getElementById('appLockOverlay').classList.add('hidden');
        loadNotes();
      } else {
        errEl.textContent = 'ভুল পাসওয়ার্ড';
      }
    } else {
      const confirmPw = document.getElementById('appLockConfirmInput').value;
      if (pw.length < 4) { errEl.textContent = 'কমপক্ষে ৪ অক্ষরের পাসওয়ার্ড দিন'; return; }
      if (pw !== confirmPw) { errEl.textContent = 'দুটি পাসওয়ার্ড মিলছে না'; return; }
      const hash = await sha256(pw);
      localStorage.setItem(APP_PW_KEY, hash);
      document.getElementById('appLockOverlay').classList.add('hidden');
      showStatus('পাসওয়ার্ড সেট হয়েছে');
      loadNotes();
    }
  }

  function lockApp() {
    initAppLock();
  }

  // allow Enter key to submit lock forms
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (!document.getElementById('appLockOverlay').classList.contains('hidden')) {
      handleAppLockSubmit();
    } else if (!document.getElementById('notePwOverlay').classList.contains('hidden')) {
      submitNotePwPrompt();
    }
  });

  // ---------- notes storage ----------
  function loadNotes() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      allNotes = raw ? JSON.parse(raw) : {};
    } catch (e) {
      console.error('load error', e);
      allNotes = {};
    }
    renderNotes();
  }

  function persistNotes() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allNotes));
  }

  function toggleNotePwField() {
    const checked = document.getElementById('noteLockToggle').checked;
    document.getElementById('notePwWrap').style.display = checked ? 'block' : 'none';
  }

  async function saveNote() {
    const name = document.getElementById('noteName').value.trim();
    const content = document.getElementById('noteContent').value;
    const wantLock = document.getElementById('noteLockToggle').checked;
    const pwVal = document.getElementById('notePwField').value;

    if (!name) {
      showStatus('নোটের নাম দিন');
      return;
    }
    if (wantLock && !pwVal) {
      showStatus('নোটের পাসওয়ার্ড দিন');
      return;
    }

    const key = editingKey || ('note_' + Date.now() + '_' + Math.random().toString(36).slice(2,8));
    const noteData = {
      name: name,
      content: content,
      date: new Date().toLocaleString('bn-BD')
    };
    if (wantLock) {
      noteData.pwHash = await sha256(pwVal);
    }

    try {
      allNotes[key] = noteData;
      persistNotes();
      showStatus('Save হয়েছে!');
      clearForm();
      renderNotes();
    } catch (e) {
      console.error(e);
      showStatus('Save ব্যর্থ হয়েছে');
    }
  }

  function clearForm() {
    editingKey = null;
    document.getElementById('noteName').value = '';
    document.getElementById('noteContent').value = '';
    document.getElementById('noteLockToggle').checked = false;
    document.getElementById('notePwField').value = '';
    document.getElementById('notePwWrap').style.display = 'none';
    resetPwVisibility('notePwField');
  }

  function toggleNote(key, event) {
    event.stopPropagation();
    const note = allNotes[key];
    if (!note) return;

    if (expandedTitles.has(key)) {
      expandedTitles.delete(key);
      renderNotes();
      return;
    }

    if (note.pwHash && !unlockedNotes.has(key)) {
      pendingUnlockKey = key;
      pendingUnlockAction = 'expand';
      document.getElementById('notePwPromptInput').value = '';
      document.getElementById('notePwError').textContent = '';
      resetPwVisibility('notePwPromptInput');
      document.getElementById('notePwOverlay').classList.remove('hidden');
      setTimeout(() => document.getElementById('notePwPromptInput').focus(), 100);
      return;
    }

    expandedTitles.add(key);
    renderNotes();
  }

  function editNote(key, event) {
    event.stopPropagation();
    const note = allNotes[key];
    if (!note) return;
    if (note.pwHash && !unlockedNotes.has(key)) {
      pendingUnlockKey = key;
      pendingUnlockAction = 'edit';
      document.getElementById('notePwPromptInput').value = '';
      document.getElementById('notePwError').textContent = '';
      resetPwVisibility('notePwPromptInput');
      document.getElementById('notePwOverlay').classList.remove('hidden');
      setTimeout(() => document.getElementById('notePwPromptInput').focus(), 100);
      return;
    }
    fillFormWithNote(key);
  }

  function fillFormWithNote(key) {
    const note = allNotes[key];
    editingKey = key;
    document.getElementById('noteName').value = note.name;
    document.getElementById('noteContent').value = note.content;
    document.getElementById('noteLockToggle').checked = !!note.pwHash;
    document.getElementById('notePwField').value = '';
    document.getElementById('notePwWrap').style.display = note.pwHash ? 'block' : 'none';
    resetPwVisibility('notePwField');
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  async function submitNotePwPrompt() {
    if (!pendingUnlockKey) return;
    const pw = document.getElementById('notePwPromptInput').value;
    const note = allNotes[pendingUnlockKey];
    if (!pw) { document.getElementById('notePwError').textContent = 'পাসওয়ার্ড দিন'; return; }
    const hash = await sha256(pw);
    if (hash === note.pwHash) {
      const key = pendingUnlockKey;
      const action = pendingUnlockAction;
      unlockedNotes.add(key);
      closeNotePwPrompt();
      if (action === 'edit') {
        fillFormWithNote(key);
      } else {
        expandedTitles.add(key);
        renderNotes();
      }
    } else {
      document.getElementById('notePwError').textContent = 'ভুল পাসওয়ার্ড';
    }
  }

  function closeNotePwPrompt() {
    pendingUnlockKey = null;
    pendingUnlockAction = 'expand';
    document.getElementById('notePwOverlay').classList.add('hidden');
  }

  function deleteNote(key, event) {
    event.stopPropagation();
    if (!confirm('এই নোটটি ডিলিট করতে চান?')) return;
    try {
      delete allNotes[key];
      persistNotes();
      if (editingKey === key) clearForm();
      expandedTitles.delete(key);
      unlockedNotes.delete(key);
      showStatus('ডিলিট হয়েছে');
      renderNotes();
    } catch (e) {
      console.error(e);
      showStatus('ডিলিট ব্যর্থ হয়েছে');
    }
  }

  const trashIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
  const lockIconSmall = '<svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/></svg>';
  const emptyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
  const editIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
  const chevronIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

  function renderNotes() {
    const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
    const listEl = document.getElementById('notesList');

    let keys = Object.keys(allNotes);
    if (searchTerm) {
      keys = keys.filter(k => allNotes[k].name.toLowerCase().includes(searchTerm));
    }
    keys.sort((a, b) => b.localeCompare(a));

    if (keys.length === 0) {
      listEl.innerHTML = `<div class="empty-msg">${emptyIcon}<div>${searchTerm ? 'কোনো নোট পাওয়া যায়নি' : 'এখনো কোনো নোট নেই। উপরে লিখে Save করুন।'}</div></div>`;
      return;
    }

    listEl.innerHTML = keys.map(key => {
      const note = allNotes[key];
      const locked = !!note.pwHash;
      const expanded = expandedTitles.has(key);
      const hiddenByLock = locked && !unlockedNotes.has(key);
      const previewText = hiddenByLock ? 'পাসওয়ার্ড দিয়ে সুরক্ষিত — খুলতে ক্লিক করুন' : (note.content || 'কোনো বিস্তারিত লেখা নেই');

      const bodyHtml = expanded ? `
          <div class="note-body">
            <div class="note-preview-full">${escapeHtml(previewText)}</div>
            <div class="note-footer">
              <span class="note-date">${note.date || ''}</span>
              <div class="note-actions">
                <button class="btn-secondary btn-sm" onclick="editNote('${key}', event)">${editIcon} সম্পাদনা</button>
                <button class="btn-danger btn-sm" onclick="deleteNote('${key}', event)">${trashIcon} Delete</button>
              </div>
            </div>
          </div>` : '';

      return `
        <div class="note-item ${locked ? 'locked' : ''} ${expanded ? 'expanded' : ''}">
          <div class="note-title-row" onclick="toggleNote('${key}', event)">
            ${locked ? lockIconSmall : ''}
            <div class="note-title">${escapeHtml(note.name)}</div>
            <span class="chevron">${chevronIcon}</span>
          </div>
          ${bodyHtml}
        </div>
      `;
    }).join('');
  }

  // ---------- boot ----------
  initAppLock();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.error('SW register failed', err));
    });
  }
</script>

</body>
</html>
